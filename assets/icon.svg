<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101726" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="50%" stop-color="#008CF0" />
      <stop offset="100%" stop-color="#005AC8" />
    </linearGradient>
    <linearGradient id="dockGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0096FF" />
      <stop offset="50%" stop-color="#007CE6" />
      <stop offset="100%" stop-color="#0054C2" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104"
        fill="url(#bgGrad)" stroke="#1E3558" stroke-width="2.5" />
  <rect x="18" y="18" width="476" height="476" rx="102" ry="102"
        fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Play Symbol Tech (Simétrico, Limpo e Forte) -->
  <polygon points="176,140 196,124 354,218 368,230 354,242 196,336 176,320"
           fill="url(#playGrad)" stroke="#7DD3FC" stroke-width="2.2"
           filter="url(#dropShadow)" stroke-linejoin="round" />

  <!-- Dock / Base Bar com Entalhe Tecnológico e Degradê Rico -->
  <polygon points="116,370 212,370 224,390 288,390 300,370 396,370 396,426 116,426"
           fill="url(#dockGrad)" stroke="#7DD3FC" stroke-width="2.2"
           filter="url(#dropShadow)" stroke-linejoin="round" />
</svg>