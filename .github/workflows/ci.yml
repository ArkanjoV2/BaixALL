name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Testes e Verificação de Publicação
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore BaixALL.sln

      - name: Compilar solução (Release)
        run: dotnet build BaixALL.sln -c Release --no-restore

      - name: Executar testes com diagnóstico de travamento
        run: >-
          dotnet test BaixALL.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --blame-hang
          --blame-hang-timeout 3m

      - name: Preservar relatórios e diagnósticos de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-diagnostics
          path: tests/**/TestResults/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Validar empacotamento autônomo (win-x64)
        run: >-
          dotnet publish src/BaixALL.App/BaixALL.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o ./dist-ci-test

      - name: Preservar artefato de teste (Build de Validação - Não Oficial)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-validation-build-win-x64
          path: ./dist-ci-test
          retention-days: 3
